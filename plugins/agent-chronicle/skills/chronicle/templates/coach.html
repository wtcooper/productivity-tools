<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Practice report</title>
<style>
:root{
  --paper:#F2F3EF;--surface:#FBFBF9;--ink:#18202B;--ink-2:#465060;--ink-3:#5F6875;--rule:#D6D9D2;--rule-2:#BFC5BC;
  --accent:#1F5C4D;--accent-soft:#E2EBE5;--seg:#D3D8D0;
  --ok:#1E6A43;--ok-bg:#DCEDE2;--part:#7F5300;--part-bg:#F4E8CB;--rev:#A0302A;--rev-bg:#F6DFDB;
  --warn:#7A4A00;--warn-bg:#FBF0D9;--warn-rule:#D9B36A;
  --scrim:rgba(16,22,30,.38);--shadow:0 1px 0 rgba(24,32,43,.04),0 10px 28px -14px rgba(24,32,43,.22);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121619;--surface:#1A1F24;--ink:#E6E8E3;--ink-2:#B7BEC6;--ink-3:#97A0AA;--rule:#2A3138;--rule-2:#3D464F;
  --accent:#8DC7AF;--accent-soft:#1A2925;--seg:#323A43;
  --ok:#8FD3A8;--ok-bg:#1B2E23;--part:#E2BE6E;--part-bg:#2F2817;--rev:#F0A39A;--rev-bg:#3A201D;
  --warn:#EBC57A;--warn-bg:#2A2416;--warn-rule:#7D6430;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark;
}}
@media screen{:root[data-theme="dark"]{
  --paper:#121619;--surface:#1A1F24;--ink:#E6E8E3;--ink-2:#B7BEC6;--ink-3:#97A0AA;--rule:#2A3138;--rule-2:#3D464F;
  --accent:#8DC7AF;--accent-soft:#1A2925;--seg:#323A43;
  --ok:#8FD3A8;--ok-bg:#1B2E23;--part:#E2BE6E;--part-bg:#2F2817;--rev:#F0A39A;--rev-bg:#3A201D;
  --warn:#EBC57A;--warn-bg:#2A2416;--warn-rule:#7D6430;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);overflow-wrap:break-word}
body.locked{overflow:hidden}
[hidden]{display:none!important}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-999px;top:8px}.skip:focus{left:16px;z-index:99;background:var(--surface);padding:8px 12px}
.prose{font:17px/1.6 var(--serif);white-space:pre-wrap;max-width:68ch;margin:0 0 12px}
.lbl{font:600 13px/1.3 var(--sans);color:var(--ink-3);margin:0 0 6px}
/* masthead */
.masthead{padding:28px 0 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:56px}
.proj{margin:0;font:600 15px/1.3 var(--sans)}
.proj .remote{font-weight:400;color:var(--ink-3);margin-left:10px}
.ctl{font:500 14px/1 var(--sans);color:var(--ink);background:transparent;border:1px solid var(--rule-2);border-radius:6px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ctl:hover{border-color:var(--ink-3)}
.ctl svg{width:15px;height:15px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px 56px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:28px}
.eyebrow{margin:0 0 14px;font:600 15px/1.2 var(--sans);color:var(--accent)}
h1{margin:0 0 14px;font:400 clamp(34px,5.4vw,58px)/1.08 var(--serif);letter-spacing:-.012em}
.gen{margin:0;color:var(--ink-2)}
.overall{min-width:260px}
.ov-num{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.ov-num b{font:400 72px/0.9 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ov-num span{font-size:17px;color:var(--ink-3)}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;color:var(--ink-2);margin:10px 0 0}
.delta svg{width:13px;height:13px;flex:none}
.delta.up svg{color:var(--ok)}.delta.down svg{color:var(--rev)}
/* meter */
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:280px}
.meter i{display:block;height:8px;background:var(--seg);border-radius:2px;position:relative;overflow:hidden}
.meter i b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.meter.sm{max-width:150px;gap:3px}.meter.sm i{height:6px}
/* sections */
.sec{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px 40px;padding:44px 0;border-top:1px solid var(--rule)}
.sec.wide{grid-template-columns:minmax(0,1fr)}
.sec:first-child{border-top:0}
.sec h2{margin:0;font:400 24px/1.2 var(--serif)}
.sec-note{margin:6px 0 0;font-size:14px;color:var(--ink-3);max-width:60ch}
.sec-body{min-width:0}
/* habits */
.habits{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));background:var(--accent-soft);border-radius:10px;border-top:3px solid var(--accent)}
.habit{padding:26px 26px 28px;border-left:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.habit:first-child{border-left:0}
.habit .n{display:block;font:400 40px/1 var(--serif);color:var(--accent);margin:0 0 14px;font-variant-numeric:lining-nums}
.habit h3{margin:0 0 10px;font:600 21px/1.3 var(--serif);white-space:pre-wrap}
.habit p{margin:0 0 14px;white-space:pre-wrap;color:var(--ink-2)}
.habit a{font-size:14px;font-weight:500}
/* scorecard */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:20px 20px 16px;box-shadow:var(--shadow);min-width:0}
.card:target{border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 12px}
.card h3{margin:0;font:600 17px/1.3 var(--sans)}
.sc{font:400 26px/1 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc span{font-size:14px;color:var(--ink-3)}
.card .meter{margin:0 0 14px}
.card .delta{margin:-6px 0 12px;font-size:13.5px}
.card .prose{font-size:16px}
.tog{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;padding:10px 0 2px;border-top:1px solid var(--rule);font:500 14px/1.3 var(--sans);color:var(--ink-2);cursor:pointer}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chev{width:14px;height:14px;color:var(--ink-3);transition:transform .15s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sg{padding:10px 0 4px}
.sg ul{list-style:none;margin:0 0 12px;padding:0}
.sg li{position:relative;padding:0 0 10px 20px;font:15.5px/1.5 var(--serif)}
.sg li .t{white-space:pre-wrap}
.sg li>svg{position:absolute;left:0;top:.38em;width:11px;height:11px}
.sg .plus>svg{color:var(--ok)}.sg .minus>svg{color:var(--rev)}
.sg .ev{margin-left:6px}
/* evidence chip */
.ev{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--sans);color:var(--ink-2);background:transparent;border:1px solid var(--rule-2);border-radius:999px;padding:5px 10px 5px 8px;cursor:pointer;vertical-align:middle;white-space:nowrap}
.ev:hover{border-color:var(--accent);color:var(--accent)}
.ev svg{width:12px;height:12px}
.ev-row{margin:10px 0 0}
/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--sans);color:var(--c);background:var(--cb);border-radius:999px;padding:5px 9px 5px 7px;white-space:nowrap}
.glyph{width:12px;height:12px;flex:none}
.gf{fill:currentColor}.gs{fill:none;stroke:currentColor;stroke-width:1.6}
.f-mostly{--c:var(--ok);--cb:var(--ok-bg)}.f-partly{--c:var(--part);--cb:var(--part-bg)}.f-rarely{--c:var(--rev);--cb:var(--rev-bg)}.f-other{--c:var(--ink-2);--cb:var(--rule)}
/* rules */
.rules{list-style:none;margin:0;padding:0}
.rules li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;padding:18px 0;border-top:1px solid var(--rule)}
.rules li:first-child{border-top:0;padding-top:0}
.rules .r{margin:0;font:600 18px/1.4 var(--serif);white-space:pre-wrap}
.rules .note{grid-column:1/-1;margin:0;color:var(--ink-2);white-space:pre-wrap;max-width:72ch}
.rules .ev-row{grid-column:1/-1;margin:2px 0 0}
/* rewrites */
.rw{margin:0 0 36px}
.rw:last-child{margin-bottom:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.orig{margin:0;padding:4px 0 4px 16px;border-left:2px solid var(--rule-2);font:16px/1.6 var(--serif);color:var(--ink-3);white-space:pre-wrap}
.better{margin:0;padding:16px 18px;background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font:16.5px/1.6 var(--serif);white-space:pre-wrap}
.rw-why{margin:12px 0 0;color:var(--ink-2);white-space:pre-wrap;max-width:76ch}
.rw-why b{color:var(--ink);font-weight:600}
.best{list-style:none;margin:0;padding:0;display:grid;gap:28px}
.best blockquote{margin:0 0 10px;padding:2px 0 2px 16px;border-left:3px solid var(--accent);font:17px/1.6 var(--serif);white-space:pre-wrap;max-width:72ch}
.best p{margin:0;color:var(--ink-2);white-space:pre-wrap;max-width:72ch}
.best .ev-row{margin-top:10px}
/* metrics */
.metrics{width:100%;border-collapse:collapse;max-width:820px}
.metrics th,.metrics td{text-align:left;padding:12px 0;border-top:1px solid var(--rule);vertical-align:top}
.metrics thead th{border-top:0;font:600 13px/1.3 var(--sans);color:var(--ink-3);padding-top:0}
.metrics td.v,.metrics th.v{text-align:right;padding-left:20px;white-space:nowrap}
.metrics td.v{font:600 18px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.metrics .m{display:block;font-weight:500}
.metrics .mn{display:block;font-size:14px;color:var(--ink-3);margin-top:2px;white-space:pre-wrap}
/* safety */
.caution{background:var(--warn-bg);border:1px solid var(--warn-rule);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:18px 20px}
.caution .ct{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:600 15px/1.3 var(--sans);color:var(--warn)}
.caution .ct svg{width:16px;height:16px}
.caution ul{margin:0;padding:0 0 0 1.1em}
.caution li{margin:0 0 8px;white-space:pre-wrap}
.caution .ev{margin-left:6px;border-color:var(--warn-rule)}
/* footer */
.foot{border-top:1px solid var(--rule);margin-top:24px;padding:28px 0 56px;font-size:14px;color:var(--ink-3)}
.foot p{margin:0 0 6px;max-width:80ch}
.foot .facts{color:var(--ink-2)}
.foot code{font:13px var(--mono);color:var(--ink)}
.empty{padding:48px 0;color:var(--ink-3)}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--rule);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--rule)}
.dr-head h2{margin:2px 0 0;font:400 20px/1.3 var(--serif)}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;color:var(--ink-2);flex:none}
.x:hover{background:var(--paper)}.x:focus-visible{outline:2px solid var(--accent)}
.dr-list{list-style:none;margin:0;padding:6px 22px 32px;overflow:auto}
.dr-list li{padding:16px 0;border-bottom:1px solid var(--rule)}
.dr-list li:last-child{border-bottom:0}
.dr-label{margin:0;font:600 14px/1.4 var(--sans)}
.dr-sess{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.dr-q{margin:10px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--rule-2);font:15.5px/1.55 var(--serif);color:var(--ink-2);white-space:pre-wrap;max-height:16em;overflow:auto}
.dr-link{display:inline-block;margin-top:10px;font-size:14px;font-weight:500}
.dr-id{font:13px var(--mono);color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){
  #drawer{animation:dr-in .22s ease-out}
  @keyframes dr-in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes dr-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
}
@media (max-width:760px){
  .sec{grid-template-columns:minmax(0,1fr);padding:36px 0}
  .hero{grid-template-columns:minmax(0,1fr)}
  .pair{grid-template-columns:minmax(0,1fr)}
  .habit{border-left:0;border-top:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
  .habit:first-child{border-top:0}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .topbar{margin-bottom:36px}
  .proj .remote{display:block;margin:2px 0 0}
  .ov-num b{font-size:60px}
  .habit{padding:22px 20px}
  #drawer{top:auto;left:0;width:100%;max-height:82vh;border-left:0;border-top:1px solid var(--rule);border-radius:14px 14px 0 0;animation-name:dr-up}
}
@media print{
  body{background:#fff;font-size:11pt}
  .ctl,.ev,.ev-row,.chev,#drawer,.scrim,.skip{display:none!important}
  .sg[hidden]{display:block!important}
  .tog{cursor:default}
  .masthead{padding-top:0}.topbar{margin-bottom:24px}
  .sec{grid-template-columns:150px minmax(0,1fr);padding:24px 0}
  .sec.wide{grid-template-columns:minmax(0,1fr)}
  .sec h2{break-after:avoid}
  .card{box-shadow:none;break-inside:avoid}
  .habit,.rw,.rules li,.best li,.caution,.metrics tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to report</a>
<header class="masthead"><div class="wrap">
  <div class="topbar">
    <p class="proj" id="proj"></p>
    <button type="button" class="ctl" id="themeBtn"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg><span id="themeLbl">Dark theme</span></button>
  </div>
  <div class="hero">
    <div>
      <p class="eyebrow">Practice report</p>
      <h1 id="title"></h1>
      <p class="gen" id="gen" hidden></p>
    </div>
    <div class="overall" id="overall" hidden></div>
  </div>
</div></header>
<main id="main" class="wrap"></main>
<footer class="foot"><div class="wrap" id="foot"></div></footer>
<div class="scrim" id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle" hidden>
  <div class="dr-head"><div><p class="lbl" id="drKick">Sources</p><h2 id="drTitle"></h2></div>
  <button type="button" class="x" id="drClose" aria-label="Close sources"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
  <ol class="dr-list" id="drList"></ol>
</aside>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const isObj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const O=x=>isObj(x)?x:{};
const A=x=>Array.isArray(x)?x:[];
const S=x=>typeof x==='string'?(x.trim()?x:''):(typeof x==='number'&&isFinite(x)?String(x):'');
const N=x=>typeof x==='number'&&isFinite(x)?x:null;
const plural=(n,w)=>n.toLocaleString('en-US')+' '+w+(n===1?'':'s');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const clip=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
const fmtS=s=>Number.isInteger(s)?String(s):s.toFixed(1);
function add(n,c){if(c==null||c===false||c==='')return;if(Array.isArray(c)){c.forEach(x=>add(n,x));return;}n.appendChild(typeof c==='string'?document.createTextNode(c):c);}
function el(tag,p){const n=document.createElement(tag);if(p)for(const k in p){const v=p[k];if(v==null||v===false)continue;if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),v);else n.setAttribute(k,v===true?'':v);}for(let i=2;i<arguments.length;i++)add(n,arguments[i]);return n;}
function sv(tag,p){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);if(p)for(const k in p){if(p[k]!=null)n.setAttribute(k,p[k]);}for(let i=2;i<arguments.length;i++)add(n,arguments[i]);return n;}
const $=id=>document.getElementById(id);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(s){s=S(s);if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);const d=m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):new Date(s);return isNaN(d)?null:d;}
const fds=s=>{const d=pd(s);return d?MON[d.getUTCMonth()]+' '+d.getUTCDate()+', '+d.getUTCFullYear():'';};
function safe(fn){try{fn();}catch(e){if(window.console)console.warn('agent-chronicle: section skipped',e);}}
const chevron=()=>sv('svg',{viewBox:'0 0 16 16',class:'chev','aria-hidden':'true'},sv('path',{d:'M4 6l4 4 4-4',fill:'none',stroke:'currentColor','stroke-width':'1.6','stroke-linecap':'round'}));

/* ---------- data ---------- */
let D=null;
try{D=JSON.parse($('data').textContent);}catch(e){D=null;}
const main=$('main');
if(!isObj(D)){main.appendChild(el('p',{class:'empty',text:'This report has no embedded data. Re-run agent-chronicle to generate it.'}));D={};}
const PJ=O(D.project),OV=O(D.overall),EV=O(D.evidence);
const DIMS=A(D.dimensions).filter(isObj);
const DMAP={};DIMS.forEach((d,i)=>{if(S(d.id))DMAP[d.id]={d:d,i:i};});
const NAME=S(PJ.name);
if(NAME)document.title=NAME+': practice report';

/* ---------- evidence drawer ---------- */
const drawer=$('drawer'),scrim=$('scrim'),drList=$('drList');let drOpener=null;
const srcIcon=()=>sv('svg',{viewBox:'0 0 12 12','aria-hidden':'true'},sv('path',{d:'M3.5 1.5h5l2 2v7h-7z M2 3v7.5h6',fill:'none',stroke:'currentColor','stroke-width':'1.2','stroke-linejoin':'round'}));
function ids(x){return A(typeof x==='string'?[x]:x).map(S).filter(Boolean);}
function chip(list,ctx){const L=ids(list);if(!L.length)return null;const n=L.length;
  return el('button',{type:'button',class:'ev','aria-haspopup':'dialog','aria-label':'Show '+plural(n,'source')+(ctx?' for '+clip(ctx,80):''),
    onclick:e=>openDrawer(L,ctx,e.currentTarget)},srcIcon(),plural(n,'source'));}
const chipRow=(l,ctx)=>{const c=chip(l,ctx);return c?el('p',{class:'ev-row'},c):null;};
function openDrawer(L,ctx,opener){drOpener=opener||null;drList.textContent='';$('drTitle').textContent=ctx?clip(ctx,140):'Sources';
  $('drKick').textContent=ctx?plural(L.length,'source'):'Evidence';
  L.forEach(id=>{const e=EV[id];
    if(!isObj(e)){drList.appendChild(el('li',null,el('p',{class:'dr-label',text:'Source not found'}),el('p',{class:'dr-id',text:id})));return;}
    const url=S(e.url),txt=S(e.text),st=S(e.session_title)||(S(e.session)?'Session '+S(e.session):'');
    drList.appendChild(el('li',null,el('p',{class:'dr-label',text:S(e.label)||S(e.kind)||id}),st?el('p',{class:'dr-sess',text:st}):null,
      txt?el('blockquote',{class:'dr-q',text:txt}):null,
      /^https?:\/\//i.test(url)?el('a',{class:'dr-link',href:url,target:'_blank',rel:'noopener noreferrer'},'Open in agentsview'):null));});
  scrim.hidden=false;drawer.hidden=false;document.body.classList.add('locked');$('drClose').focus();}

/* ---------- theme ---------- */
const root=document.documentElement,mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;

if(mq&&mq.addEventListener)mq.addEventListener('change',syncT);syncT();

/* ---------- pieces ---------- */
function meter(s,sm){const m=el('div',{class:'meter'+(sm?' sm':''),role:'img','aria-label':'Score '+fmtS(s)+' out of 4'});
  for(let i=0;i<4;i++){const b=el('b');b.style.width=(Math.max(0,Math.min(1,s-i))*100)+'%';m.appendChild(el('i',null,b));}return m;}
function arrow(dir){return sv('svg',{viewBox:'0 0 14 14','aria-hidden':'true'},dir===0?sv('path',{d:'M2 7h10',stroke:'currentColor','stroke-width':'1.8','stroke-linecap':'round'}):
  sv('path',{d:dir>0?'M7 12V2M3 6l4-4 4 4':'M7 2v10M3 8l4 4 4-4',fill:'none',stroke:'currentColor','stroke-width':'1.8','stroke-linecap':'round','stroke-linejoin':'round'}));}
function delta(cur,prev,since,long){if(cur==null||prev==null)return null;const d=Math.round((cur-prev)*10)/10,dir=d>0?1:d<0?-1:0;
  const txt=long?(dir===0?'Unchanged':(dir>0?'Up ':'Down ')+fmtS(Math.abs(d)))+' since '+(since||'the last report')

  return el('p',{class:'delta'+(dir>0?' up':dir<0?' down':'')},arrow(dir),txt);}
const FL={mostly:'Followed mostly',partly:'Followed partly',rarely:'Followed rarely'};

  if(f==='mostly')return g(sv('path',{d:CIRC,class:'gf'}));
  if(f==='partly')return g([sv('path',{d:CIRC,class:'gs'}),sv('path',{d:'M0,-4.6A4.6,4.6 0 0 1 0,4.6Z',class:'gf'})]);
  return g(sv('path',{d:CIRC,class:'gs'}));}
function section(id,title,opt){const body=el('div',{class:'sec-body'});

    el('div',null,el('h2',{id:id+'-h',text:title}),opt&&opt.note?el('p',{class:'sec-note',text:opt.note}):null),body));return body;}

/* ---------- sections ---------- */
function header(){
  $('proj').appendChild(document.createTextNode(NAME||'Untitled project'));
  if(S(PJ.remote))$('proj').appendChild(el('span',{class:'remote',text:S(PJ.remote)}));
  $('title').textContent=NAME||'Practice report';
  const g=S(D.generated_at),gd=g?new Date(g):null;
  if(gd&&!isNaN(gd)){$('gen').textContent='Generated '+gd.toLocaleDateString('en-US',{dateStyle:'long'});$('gen').hidden=false;}
  const s=N(OV.score);if(s==null)return;const box=$('overall');

function dimLink(id){const m=DMAP[S(id)];if(!m)return null;const d=m.d,sc=N(d.score);
  return el('a',{href:'#dim-'+m.i},(S(d.name)||S(d.id))+(sc!=null?' (now '+fmtS(sc)+' of 4)':''));}
function habits(){
  const L=A(D.habits).filter(isObj).filter(h=>S(h.title)||S(h.detail));if(!L.length)return;
  const b=section('habits','Try next',{wide:true,note:L.length===1?'The one habit most likely to raise your scores.':'The '+L.length+' habits most likely to raise your scores, in priority order.'});
  b.appendChild(el('ol',{class:'habits'},L.map((h,i)=>el('li',{class:'habit'},el('span',{class:'n','aria-hidden':'true',text:String(i+1)}),
    S(h.title)?el('h3',{text:S(h.title)}):null,S(h.detail)?el('p',{text:S(h.detail)}):null,dimLink(h.dimension)))));
}
function scorecard(){

  const grid=el('div',{class:'cards'});

    const c=el('article',{class:'card',id:'dim-'+i,'aria-labelledby':'dim-'+i+'-h'},
      el('div',{class:'card-top'},el('h3',{id:'dim-'+i+'-h',text:nm}),s!=null?el('p',{class:'sc',style:'margin:0'},fmtS(s),el('span',{text:' / 4'})):null),
      s!=null?meter(s,true):null,s!=null?delta(s,N(d.previous)):null,S(d.summary)?el('p',{class:'prose',text:S(d.summary)}):null);
    if(st.length||gp.length){const id='sg-'+i,parts=[];if(st.length)parts.push(plural(st.length,'strength'));if(gp.length)parts.push(plural(gp.length,'gap'));
      const icon=k=>sv('svg',{viewBox:'0 0 12 12','aria-hidden':'true'},sv('path',{d:k?'M2 6h8M6 2v8':'M2 6h8',stroke:'currentColor','stroke-width':'1.8','stroke-linecap':'round'}));
      const body=el('div',{class:'sg',id:id,hidden:true},
        st.length?[el('p',{class:'lbl',text:'Strengths'}),el('ul',null,st.map(x=>el('li',{class:'plus'},icon(true),el('span',{class:'t',text:S(x.text)}),chip(x.evidence,nm+': strength'))))]:null,
        gp.length?[el('p',{class:'lbl',text:'Gaps'}),el('ul',null,gp.map(x=>el('li',{class:'minus'},icon(false),el('span',{class:'t',text:S(x.text)}),chip(x.evidence,nm+': gap'))))]:null);
      const t=el('button',{type:'button',class:'tog','aria-expanded':'false','aria-controls':id,onclick:()=>{const o=body.hidden;body.hidden=!o;t.setAttribute('aria-expanded',String(o));}},
        el('span',{text:parts.join(' and ')}),chevron());
      c.appendChild(t);c.appendChild(body);}
    grid.appendChild(c);});
  b.appendChild(grid);
}
function rules(){
  const L=A(D.own_rules).filter(isObj).filter(r=>S(r.rule));if(!L.length)return;

  b.appendChild(el('ul',{class:'rules'},L.map(r=>{const f=S(r.followed).toLowerCase();
    return el('li',null,el('p',{class:'r',text:S(r.rule)}),f?el('span',{class:'badge f-'+(FL[f]?f:'other')},fGlyph(f),FL[f]||cap(f)):el('span'),
      S(r.note)?el('p',{class:'note',text:S(r.note)}):null,chipRow(r.evidence,S(r.rule)));})));
}
function rewrites(){

    el('tbody',null,L.map(m=>el('tr',null,el('td',null,el('span',{class:'m',text:S(m.label)}),S(m.note)?el('span',{class:'mn',text:S(m.note)}):null),el('td',{class:'v',text:S(m.value)||'n/a'}))))));

  f.appendChild(el('p',{class:'facts',text:'Scores are model judgments anchored to a rubric and the cited evidence. Metrics are computed from session logs and git.'}));
  f.appendChild(el('p',null,'For usage-wide patterns across all your projects, run ',el('code',{text:'/insights'}),' in Claude Code.'));

safe(header);safe(habits);safe(scorecard);safe(rules);safe(rewrites);safe(best);safe(metrics);safe(safety);safe(footer);
